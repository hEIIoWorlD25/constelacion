<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nuestro primer beso ✨</title>

    <meta
        property="og:title"
        content="Nuestro primer beso ✨"
    >

    <meta
        property="og:description"
        content="Hay fechas que uno nunca olvida ❤️"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }


        /* =========================
           PANTALLA DE ENTRADA
        ========================= */

        #intro {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000;

            z-index: 100;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }


        #intro.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .login-box {

            width: min(
                90vw,
                400px
            );

            text-align: center;

            padding: 30px;
        }


        .small-text {

            font-size: 13px;

            letter-spacing: 3px;

            color: #aaa;

            margin-bottom: 18px;
        }


        .login-box h1 {

            font-size:
                clamp(
                    21px,
                    6vw,
                    30px
                );

            font-weight: 400;

            letter-spacing: 2px;

            margin-bottom: 12px;
        }


        .subtitle {

            font-size: 14px;

            color: #aaa;

            margin-bottom: 30px;
        }



        /* =========================
           INPUT DE FECHA
        ========================= */

        .date-wrapper {

            margin-bottom: 20px;
        }


        input[type="date"] {

            width: 100%;

            padding:
                15px
                18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .05
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .45
                );

            color: white;

            border-radius: 12px;

            font-size: 16px;

            letter-spacing: 1px;

            outline: none;

            color-scheme: dark;

            transition: .3s ease;
        }


        input[type="date"]:focus {

            border-color: white;

            box-shadow:
                0 0 15px
                rgba(
                    255,
                    255,
                    255,
                    .15
                );
        }



        /* =========================
           BOTÓN
        ========================= */

        #enterButton {

            width: 100%;

            padding:
                14px
                20px;

            border:
                1px solid white;

            border-radius: 40px;

            background: transparent;

            color: white;

            font-size: 14px;

            letter-spacing: 2px;

            cursor: pointer;

            transition: .35s ease;
        }


        #enterButton:hover {

            background: white;

            color: black;

            transform:
                translateY(-2px);
        }



        /* =========================
           MENSAJE DE ERROR
        ========================= */

        #errorMessage {

            min-height: 25px;

            margin-top: 18px;

            color: #aaa;

            font-size: 13px;

            letter-spacing: 1px;

            opacity: 0;

            transition: opacity .4s ease;
        }


        #errorMessage.visible {

            opacity: 1;
        }



        /* =========================
           EFECTO ERROR
        ========================= */

        .shake {

            animation:
                shake
                .4s ease;
        }


        @keyframes shake {

            0% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-7px);
            }

            50% {
                transform:
                    translateX(7px);
            }

            75% {
                transform:
                    translateX(-4px);
            }

            100% {
                transform:
                    translateX(0);
            }

        }



        /* =========================
           FONDO ESTRELLADO
        ========================= */

        #stars {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 0;

            opacity: 0;

            transition:
                opacity
                2.5s ease;
        }


        #stars.visible {

            opacity: 1;
        }



        /* =========================
           CONTENIDO PRINCIPAL
        ========================= */

        #mainContent {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            z-index: 2;

            opacity: 0;

            transform:
                scale(.96);

            transition:
                opacity
                2.5s ease,
                transform
                2.5s ease;
        }


        #mainContent.visible {

            opacity: 1;

            transform:
                scale(1);
        }



        /* =========================
           CONSTELACIÓN
        ========================= */

        .constellation-container {

            position: relative;

            width:
                min(
                    96vw,
                    620px
                );

            display: flex;

            justify-content: center;

            align-items: center;

            animation:
                floating
                7s
                ease-in-out
                infinite;
        }


        .constellation {

            width: 100%;

            height: auto;

            display: block;

            user-select: none;

            pointer-events: none;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(
                        255,
                        255,
                        255,
                        .15
                    )
                );
        }



        @keyframes floating {

            0% {

                transform:
                    translateY(0)
                    scale(1);

            }

            50% {

                transform:
                    translateY(-8px)
                    scale(1.005);

            }

            100% {

                transform:
                    translateY(0)
                    scale(1);

            }
        }



        /* =========================
           BRILLOS
        ========================= */

        .sparkle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            box-shadow:
                0 0 4px white,
                0 0 10px white;

            animation:
                sparkle
                3s
                infinite;

            pointer-events: none;
        }


        @keyframes sparkle {

            0%,
            100% {

                opacity: 0;

                transform:
                    scale(.5);

            }

            50% {

                opacity: 1;

                transform:
                    scale(1.7);

            }
        }



        /* =========================
           CELULAR
        ========================= */

        @media (
            max-width: 600px
        ) {

            .login-box {

                padding:
                    25px
                    18px;

            }

            .constellation-container {

                width: 98vw;

            }

        }

    </style>

</head>

<body>


    <!-- =========================
         PANTALLA DE FECHA
    ========================= -->

    <section id="intro">

        <div
            class="login-box"
            id="loginBox"
        >

            <p class="small-text">
                SOLO TÚ SABES LA RESPUESTA
            </p>

            <h1>
                ¿Qué día comenzó nuestra historia?
            </h1>

            <p class="subtitle">
                Ingresa una fecha que nunca quiero olvidar.
            </p>


            <div class="date-wrapper">

                <input
                    type="date"
                    id="specialDate"
                >

            </div>


            <button id="enterButton">
                ENTRAR ♡
            </button>


            <p id="errorMessage">
                Esa no es nuestra fecha 🤍
            </p>

        </div>

    </section>



    <!-- =========================
         FONDO DE ESTRELLAS
    ========================= -->

    <canvas id="stars"></canvas>



    <!-- =========================
         CONSTELACIÓN
    ========================= -->

    <main id="mainContent">

        <div
            class="constellation-container"
            id="constellation"
        >

            <img
                src="assets/constelacion.png"
                alt="Nuestro primer beso"
                class="constellation"
            >

        </div>

    </main>



    <!-- =========================
         AUDIO
    ========================= -->

    <audio
        id="music"
        preload="auto"
        loop
    >

        <source
            src="assets/musica.mp3"
            type="audio/mpeg"
        >

    </audio>



<script>


/* ==========================================
   FECHA CORRECTA
========================================== */

/*
La fecha del primer beso:

20 de mayo de 2026

Formato interno:
AAAA-MM-DD
*/

const correctDate =
    "2026-05-20";



const intro =
    document.getElementById(
        "intro"
    );


const loginBox =
    document.getElementById(
        "loginBox"
    );


const dateInput =
    document.getElementById(
        "specialDate"
    );


const enterButton =
    document.getElementById(
        "enterButton"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const music =
    document.getElementById(
        "music"
    );


const mainContent =
    document.getElementById(
        "mainContent"
    );


const starsCanvas =
    document.getElementById(
        "stars"
    );



/* ==========================================
   VALIDAR FECHA
========================================== */


async function validateDate() {


    const enteredDate =
        dateInput.value;


    if (
        enteredDate === correctDate
    ) {


        /*
        Ocultamos cualquier error.
        */

        errorMessage.classList.remove(
            "visible"
        );


        /*
        Iniciamos la música.
        */

        try {

            await music.play();

        }

        catch (error) {

            console.log(
                "No se pudo iniciar el audio:",
                error
            );

        }


        /*
        Desaparece el acceso.
        */

        intro.classList.add(
            "hidden"
        );


        /*
        Aparecen las estrellas.
        */

        starsCanvas.classList.add(
            "visible"
        );


        /*
        Aparece lentamente
        la constelación.
        */

        setTimeout(

            () => {

                mainContent.classList.add(
                    "visible"
                );

            },

            500

        );


    }

    else {


        /*
        Mensaje si falla.
        */

        errorMessage.classList.add(
            "visible"
        );


        /*
        Pequeña vibración.
        */

        loginBox.classList.remove(
            "shake"
        );


        void loginBox.offsetWidth;


        loginBox.classList.add(
            "shake"
        );


    }

}



enterButton.addEventListener(

    "click",

    validateDate

);



/*
También permite presionar ENTER.
*/

dateInput.addEventListener(

    "keydown",

    event => {


        if (
            event.key === "Enter"
        ) {

            validateDate();

        }


    }

);



/* ==========================================
   ESTRELLAS DE FONDO
========================================== */


const canvas =
    document.getElementById(
        "stars"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let stars = [];


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();



window.addEventListener(

    "resize",

    () => {

        resizeCanvas();

        createStars();

    }

);



function createStars() {


    stars = [];


    const amount =

        Math.floor(

            (
                window.innerWidth
                *
                window.innerHeight
            )

            /

            8500

        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        stars.push({

            x:
                Math.random()
                *
                canvas.width,

            y:
                Math.random()
                *
                canvas.height,

            radius:
                Math.random()
                *
                1.2
                +
                .2,

            opacity:
                Math.random(),

            speed:
                Math.random()
                *
                .015
                +
                .005,

            direction:
                Math.random()
                >
                .5
                ?
                1
                :
                -1

        });


    }


}


createStars();



function animateStars() {


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    stars.forEach(

        star => {


            star.opacity +=

                star.speed
                *
                star.direction;


            if (
                star.opacity >= 1
            ) {

                star.opacity = 1;

                star.direction = -1;

            }


            if (
                star.opacity <= .15
            ) {

                star.opacity = .15;

                star.direction = 1;

            }


            ctx.beginPath();


            ctx.arc(

                star.x,

                star.y,

                star.radius,

                0,

                Math.PI * 2

            );


            ctx.fillStyle =

                `rgba(
                    255,
                    255,
                    255,
                    ${star.opacity}
                )`;


            ctx.fill();


        }

    );


    requestAnimationFrame(
        animateStars
    );

}


animateStars();



/* ==========================================
   BRILLOS SOBRE CONSTELACIÓN
========================================== */


const constellation =

    document.getElementById(
        "constellation"
    );


function createSparkles() {


    const amount = 30;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const sparkle =

            document.createElement(
                "span"
            );


        sparkle.classList.add(
            "sparkle"
        );


        sparkle.style.left =

            (
                15
                +
                Math.random()
                *
                70
            )
            +
            "%";


        sparkle.style.top =

            (
                8
                +
                Math.random()
                *
                65
            )
            +
            "%";


        sparkle.style.animationDelay =

            (
                Math.random()
                *
                5
            )
            +
            "s";


        sparkle.style.animationDuration =

            (
                2
                +
                Math.random()
                *
                4
            )
            +
            "s";


        constellation.appendChild(
            sparkle
        );


    }


}


createSparkles();


</script>


</body>

</html>
