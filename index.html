<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nuestro primer beso ✨</title>

    <meta
        property="og:title"
        content="Nuestro primer beso ✨"
    >

    <meta
        property="og:description"
        content="Hay fechas que uno nunca olvida ❤️"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            overflow-x: hidden;
        }


        /* =====================================
           PANTALLA INICIAL
        ===================================== */

        #intro {

            position: fixed;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #000;

            z-index: 100;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;

        }


        #intro.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .login-box {

            width: min(
                90vw,
                400px
            );

            text-align: center;

            padding: 30px;

        }


        .small-text {

            font-size: 12px;

            letter-spacing: 3px;

            color: #aaa;

            margin-bottom: 18px;

        }


        .login-box h1 {

            font-size:
                clamp(
                    21px,
                    6vw,
                    30px
                );

            font-weight: 400;

            letter-spacing: 2px;

            line-height: 1.3;

            margin-bottom: 15px;

        }


        .subtitle {

            font-size: 14px;

            color: #999;

            line-height: 1.6;

            margin-bottom: 30px;

        }


        /* =====================================
           INPUT DE FECHA
        ===================================== */

        .date-wrapper {

            margin-bottom: 20px;

        }


        input[type="date"] {

            width: 100%;

            padding: 15px 18px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.04
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            color: white;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            color-scheme: dark;

            transition:
                border-color .3s ease,
                box-shadow .3s ease;

        }


        input[type="date"]:focus {

            border-color: white;

            box-shadow:
                0 0 20px
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

        }


        /* =====================================
           BOTÓN
        ===================================== */

        #enterButton {

            width: 100%;

            padding: 14px 20px;

            background: transparent;

            color: white;

            border: 1px solid white;

            border-radius: 40px;

            font-size: 14px;

            letter-spacing: 2px;

            cursor: pointer;

            transition:
                all .35s ease;

        }


        #enterButton:hover {

            background: white;

            color: black;

            transform:
                translateY(-2px);

        }


        /* =====================================
           MENSAJE ERROR
        ===================================== */

        #errorMessage {

            min-height: 25px;

            margin-top: 18px;

            color: #aaa;

            font-size: 13px;

            letter-spacing: 1px;

            opacity: 0;

            transition:
                opacity .4s ease;

        }


        #errorMessage.visible {

            opacity: 1;

        }


        .shake {

            animation:
                shake
                .4s ease;

        }


        @keyframes shake {

            0% {
                transform:
                    translateX(0);
            }

            25% {
                transform:
                    translateX(-7px);
            }

            50% {
                transform:
                    translateX(7px);
            }

            75% {
                transform:
                    translateX(-4px);
            }

            100% {
                transform:
                    translateX(0);
            }

        }


        /* =====================================
           FONDO ESTRELLADO
        ===================================== */

        #stars {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 0;

            opacity: 0;

            transition:
                opacity 2.5s ease;

        }


        #stars.visible {

            opacity: 1;

        }


        /* =====================================
           CONTENIDO PRINCIPAL
        ===================================== */

        #mainContent {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            z-index: 2;

            padding:
                20px
                10px;

            opacity: 0;

            transform:
                scale(.96);

            transition:
                opacity 2.5s ease,
                transform 2.5s ease;

        }


        #mainContent.visible {

            opacity: 1;

            transform:
                scale(1);

        }


        /* =====================================
           ESCENA 3D
        ===================================== */

        .constellation-scene {

            width:
                min(
                    96vw,
                    620px
                );

            perspective: 1200px;

            perspective-origin:
                center center;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .constellation-container {

            position: relative;

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            transform-style: preserve-3d;

            transform:
                rotateX(0deg)
                rotateY(0deg);

            transition:
                transform
                .18s
                ease-out;

            will-change: transform;

        }


        /* =====================================
           IMAGEN CONSTELACIÓN
        ===================================== */

        .constellation {

            position: relative;

            width: 100%;

            height: auto;

            display: block;

            z-index: 3;

            transform:
                translateZ(42px);

            user-select: none;

            pointer-events: none;

            filter:

                drop-shadow(
                    0px
                    20px
                    20px
                    rgba(
                        0,
                        0,
                        0,
                        .7
                    )
                )

                drop-shadow(
                    0
                    0
                    12px
                    rgba(
                        255,
                        255,
                        255,
                        .14
                    )
                );

        }


        /* =====================================
           RESPLANDOR DETRÁS
        ===================================== */

        .back-glow {

            position: absolute;

            width: 78%;
            height: 78%;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(
                        255,
                        255,
                        255,
                        .12
                    )
                    0%,

                    rgba(
                        255,
                        255,
                        255,
                        .04
                    )
                    35%,

                    transparent
                    72%
                );

            filter:
                blur(35px);

            transform:
                translateZ(-40px)
                scale(.95);

            z-index: 1;

            pointer-events: none;

        }


        /* =====================================
           BRILLOS SOBRE CONSTELACIÓN
        ===================================== */

        .sparkle {

            position: absolute;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: white;

            opacity: 0;

            z-index: 5;

            pointer-events: none;

            box-shadow:

                0 0 4px white,

                0 0 10px
                rgba(
                    255,
                    255,
                    255,
                    .9
                ),

                0 0 18px
                rgba(
                    255,
                    255,
                    255,
                    .4
                );

            animation:
                sparkle
                3s
                infinite;

        }


        @keyframes sparkle {

            0%,
            100% {

                opacity: 0;

                scale: .5;

            }

            50% {

                opacity: 1;

                scale: 1.8;

            }

        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (
            max-width: 600px
        ) {

            .login-box {

                padding:
                    25px
                    18px;

            }


            .constellation-scene {

                width: 98vw;

            }


            #mainContent {

                padding:
                    5px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         PANTALLA DE ENTRADA
    ====================================== -->

    <section id="intro">

        <div
            class="login-box"
            id="loginBox"
        >

            <p class="small-text">
                SOLO TÚ SABES LA RESPUESTA
            </p>


            <h1>
                ¿Qué día comenzó nuestra historia?
            </h1>


            <p class="subtitle">
                Ingresa una fecha que nunca quiero olvidar.
            </p>


            <div class="date-wrapper">

                <input
                    type="date"
                    id="specialDate"
                >

            </div>


            <button id="enterButton">
                ENTRAR ♡
            </button>


            <p id="errorMessage">
                Esa no es nuestra fecha 🤍
            </p>

        </div>

    </section>



    <!-- =====================================
         FONDO DE ESTRELLAS
    ====================================== -->

    <canvas id="stars"></canvas>



    <!-- =====================================
         CONSTELACIÓN
    ====================================== -->

    <main id="mainContent">

        <div class="constellation-scene">

            <div
                class="constellation-container"
                id="constellation3D"
            >

                <div class="back-glow"></div>


                <img
                    src="assets/constelacion.png"
                    alt="Nuestro primer beso"
                    class="constellation"
                >

            </div>

        </div>

    </main>



    <!-- =====================================
         MÚSICA
    ====================================== -->

    <audio
        id="music"
        preload="auto"
        loop
    >

        <source
            src="assets/musica.mp3"
            type="audio/mpeg"
        >

    </audio>



<script>


/* ==========================================
   FECHA CORRECTA
========================================== */


/*
20 de mayo de 2026

Formato:

AAAA-MM-DD
*/

const correctDate =
    "2026-05-20";



const intro =
    document.getElementById(
        "intro"
    );


const loginBox =
    document.getElementById(
        "loginBox"
    );


const dateInput =
    document.getElementById(
        "specialDate"
    );


const enterButton =
    document.getElementById(
        "enterButton"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const music =
    document.getElementById(
        "music"
    );


const mainContent =
    document.getElementById(
        "mainContent"
    );


const starsCanvas =
    document.getElementById(
        "stars"
    );


const constellation3D =
    document.getElementById(
        "constellation3D"
    );



/* ==========================================
   VALIDAR FECHA
========================================== */

async function validateDate() {


    const enteredDate =
        dateInput.value;


    if (
        enteredDate === correctDate
    ) {


        errorMessage.classList.remove(
            "visible"
        );


        /*
        Empieza la música.
        Al tener LOOP, volverá
        a comenzar automáticamente.
        */

        try {

            music.currentTime = 0;

            await music.play();

        }

        catch (error) {

            console.log(
                "No se pudo iniciar la música:",
                error
            );

        }


        /*
        Desaparece la pantalla
        de acceso.
        */

        intro.classList.add(
            "hidden"
        );


        /*
        Aparece fondo de estrellas.
        */

        starsCanvas.classList.add(
            "visible"
        );


        /*
        Aparece la constelación.
        */

        setTimeout(

            () => {

                mainContent.classList.add(
                    "visible"
                );

            },

            450

        );


    }

    else {


        errorMessage.classList.add(
            "visible"
        );


        loginBox.classList.remove(
            "shake"
        );


        void loginBox.offsetWidth;


        loginBox.classList.add(
            "shake"
        );


    }


}



enterButton.addEventListener(

    "click",

    validateDate

);



dateInput.addEventListener(

    "keydown",

    event => {


        if (
            event.key === "Enter"
        ) {

            validateDate();

        }


    }

);



/* ==========================================
   FONDO DE ESTRELLAS
========================================== */


const canvas =
    document.getElementById(
        "stars"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let stars = [];



function resizeCanvas() {


    canvas.width =
        window.innerWidth;


    canvas.height =
        window.innerHeight;


}



resizeCanvas();



window.addEventListener(

    "resize",

    () => {


        resizeCanvas();

        createStars();


    }

);



function createStars() {


    stars = [];


    const amount =

        Math.floor(

            (
                window.innerWidth
                *
                window.innerHeight
            )

            /

            8500

        );


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        stars.push({

            x:
                Math.random()
                *
                canvas.width,

            y:
                Math.random()
                *
                canvas.height,

            radius:
                Math.random()
                *
                1.2
                +
                .2,

            opacity:
                Math.random(),

            speed:
                Math.random()
                *
                .012
                +
                .004,

            direction:
                Math.random()
                >
                .5
                ?
                1
                :
                -1

        });


    }


}



createStars();



function animateStars() {


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    stars.forEach(

        star => {


            star.opacity +=

                star.speed
                *
                star.direction;


            if (
                star.opacity >= 1
            ) {


                star.opacity = 1;

                star.direction = -1;


            }


            if (
                star.opacity <= .15
            ) {


                star.opacity = .15;

                star.direction = 1;


            }


            ctx.beginPath();


            ctx.arc(

                star.x,

                star.y,

                star.radius,

                0,

                Math.PI * 2

            );


            ctx.fillStyle =

                `rgba(
                    255,
                    255,
                    255,
                    ${star.opacity}
                )`;


            ctx.fill();


        }

    );


    requestAnimationFrame(
        animateStars
    );


}



animateStars();



/* ==========================================
   BRILLOS SOBRE CONSTELACIÓN
========================================== */


function createSparkles() {


    const amount = 32;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const sparkle =

            document.createElement(
                "span"
            );


        sparkle.classList.add(
            "sparkle"
        );


        /*
        Las posiciones se concentran
        donde está el círculo principal
        de tu imagen.
        */

        sparkle.style.left =

            (
                14
                +
                Math.random()
                *
                72
            )
            +
            "%";


        sparkle.style.top =

            (
                7
                +
                Math.random()
                *
                63
            )
            +
            "%";


        sparkle.style.animationDelay =

            (
                Math.random()
                *
                5
            )
            +
            "s";


        sparkle.style.animationDuration =

            (
                2
                +
                Math.random()
                *
                4
            )
            +
            "s";


        /*
        Algunas estrellas quedan
        un poco más adelante.
        */

        sparkle.style.transform =

            `
            translateZ(
                ${
                    55
                    +
                    Math.random()
                    *
                    50
                }px
            )
            `;


        constellation3D.appendChild(
            sparkle
        );


    }


}



createSparkles();



/* ==========================================
   EFECTO 3D CON EL MOUSE
========================================== */


document.addEventListener(

    "mousemove",

    event => {


        /*
        Solo hacemos el efecto
        cuando ya se ha ingresado.
        */

        if (
            !mainContent.classList.contains(
                "visible"
            )
        ) {

            return;

        }


        const centerX =
            window.innerWidth / 2;


        const centerY =
            window.innerHeight / 2;


        const mouseX =
            event.clientX
            -
            centerX;


        const mouseY =
            event.clientY
            -
            centerY;


        /*
        Inclinación máxima:
        aproximadamente 6 grados.
        */

        const rotateY =

            (
                mouseX
                /
                centerX
            )

            *
            6;


        const rotateX =

            -(

                mouseY
                /
                centerY

            )

            *
            6;


        constellation3D.style.transform =

            `
            rotateX(
                ${rotateX}deg
            )

            rotateY(
                ${rotateY}deg
            )
            `;


    }

);



/* ==========================================
   VOLVER AL CENTRO
========================================== */


document.addEventListener(

    "mouseleave",

    () => {


        constellation3D.style.transform =

            `
            rotateX(0deg)
            rotateY(0deg)
            `;


    }

);



/* ==========================================
   EFECTO 3D EN CELULAR
========================================== */


document.addEventListener(

    "touchmove",

    event => {


        if (
            !mainContent.classList.contains(
                "visible"
            )
        ) {

            return;

        }


        const touch =
            event.touches[0];


        if (!touch) {

            return;

        }


        const centerX =
            window.innerWidth / 2;


        const centerY =
            window.innerHeight / 2;


        const touchX =
            touch.clientX
            -
            centerX;


        const touchY =
            touch.clientY
            -
            centerY;


        const rotateY =

            (
                touchX
                /
                centerX
            )

            *
            5;


        const rotateX =

            -(

                touchY
                /
                centerY

            )

            *
            5;


        constellation3D.style.transform =

            `
            rotateX(
                ${rotateX}deg
            )

            rotateY(
                ${rotateY}deg
            )
            `;


    },

    {
        passive: true
    }

);



document.addEventListener(

    "touchend",

    () => {


        constellation3D.style.transform =

            `
            rotateX(0deg)
            rotateY(0deg)
            `;


    }

);


</script>


</body>

</html>
